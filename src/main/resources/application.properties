spring.application.name=projectname
server.port=8080

# --- MySQL (createDatabaseIfNotExist creates learngo_db automatically) ---
spring.datasource.url=jdbc:mysql://localhost:3306/learngo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate: auto-create and update tables from the @Entity classes ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Logging (debug-friendly) ---
logging.level.com.csit321section.groupname=DEBUG
